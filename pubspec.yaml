name: stylemuse_ai
description: StyleMuse AI Android wardrobe
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  http: ^1.2.2
  in_app_purchase: ^3.2.3
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  image: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stylemuse-icon.png
    - assets/profile-avatar.webp
    - assets/home/
    - assets/mannequins/
